<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css" />

    <title>LifeBoard</title>
  </head>
  <body>
    <!-- Navbar Start -->
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <a href="#" class="navbar-brand">LifeBoard</a>
      </div>
    </nav>
    <!-- Navbar End -->

    <div class="container py-5">
      <h1 class="text-center mb-5">LifeBoard</h1>

      <div class="row g-4 mt-4">
        <div class="col-md-3">
          <div class="card">
            <div class="card-body">
              <h5 class="card-title">Tasks</h5>
              <p id="task-count" class="card-text fs-3 fw-bold">0</p>
            </div>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card">
            <div class="card-body">
              <h5 class="card-title">Expenses</h5>
              <p class="card-text fs-3 fw-bold">0 ₺</p>
            </div>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card">
            <div class="card-body">
              <h5 class="card-title">Notes</h5>
              <p class="card-text fs-3 fw-bold">0</p>
            </div>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card">
            <div class="card-body">
              <h5 class="card-title">Completed</h5>
              <p id="completed-count" class="card-text fs-3 fw-bold">0</p>
            </div>
          </div>
        </div>
      </div>

      <div class="row mt-5">
        <div class="col-lg-6">
          <div class="card">
            <div class="card-body">
              <h3 class="mb-4">Add New Task</h3>

              <form id="task-form">
                <div class="mb-3">
                  <label class="form-label">Task Title</label>
                  <input
                    type="text"
                    id="task-input"
                    class="form-control"
                    placeholder="Enter task..."
                  />
                </div>

                <div class="mb-3">
                  <label class="form-label">Priority</label>

                  <select id="task-priority" class="form-select">
                    <option value="LOW">Low Priority</option>
                    <option value="MEDIUM" selected>Medium Priority</option>
                    <option value="HIGH">High Priority</option>
                  </select>
                </div>

                <div class="mb-3">
                  <label class="form-label">Deadline</label>
                  <input type="date" id="task-deadline" class="form-control" />
                </div>

                <button class="btn btn-dark w-100">Add Task</button>
              </form>

              <div class="card mt-4">
                <div class="card-body">
                  <h3 class="mb-4">Task List</h3>

                  <div class="d-flex gap-2 mb-3 flex-wrap">
                    <button class="btn btn-dark filter-btn" data-filter="all">
                      All
                    </button>

                    <button
                      class="btn btn-success filter-btn"
                      data-filter="completed"
                    >
                      Completed
                    </button>

                    <button
                      class="btn btn-primary filter-btn"
                      data-filter="pending"
                    >
                      Pending
                    </button>

                    <button
                      class="btn btn-danger filter-btn"
                      data-filter="high"
                    >
                      High
                    </button>

                    <button
                      class="btn btn-warning filter-btn"
                      data-filter="medium"
                    >
                      Medium
                    </button>

                    <button
                      class="btn btn-secondary filter-btn"
                      data-filter="low"
                    >
                      Low
                    </button>
                  </div>

                  <div class="d-flex gap-2 mb-4 flex-wrap">
                    <button
                      class="btn btn-danger filter-btn"
                      data-filter="overdue"
                    >
                      Overdue
                    </button>
                    <button
                      class="btn btn-warning filter-btn"
                      data-filter="today"
                    >
                      Due Today
                    </button>
                    <button
                      class="btn btn-info filter-btn"
                      data-filter="upcoming"
                    >
                      Upcoming
                    </button>
                    <button
                      class="btn btn-dark filter-btn"
                      data-filter="no-deadline"
                    >
                      No Deadline
                    </button>
                  </div>

                  <select id="sort-select" class="form-select mb-3">
                    <option value="priority">Sort by Priority</option>

                    <option value="newest">Sort by Newest</option>

                    <option value="oldest">Sort by Oldest</option>

                    <option value="deadline-nearest">Deadline Nearest</option>

                    <option value="deadline-farthest">Deadline Farthest</option>
                  </select>

                  <input
                    type="text"
                    id="search-input"
                    class="form-control mb-4"
                    placeholder="Search task..."
                  />

                  <ul id="task-list" class="list-group"></ul>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="/js/app.js"></script>
  </body>
</html>
